[project]
name = "pricehunter"
version = "0.1.0"
description = "Reusable international price tracking backend with a Telegram client"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "aiogram>=3.15,<4",
  "SQLAlchemy[asyncio]>=2.0.36,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "redis>=5,<6",
  "arq>=0.26,<0.29", "httpx>=0.28,<0.29", "httpcore>=1,<2", "certifi>=2024.8.30",
  "babel>=2.16,<3", "structlog>=24,<27",
]

[dependency-groups]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "respx>=0.22,<1", "fakeredis[lua]>=2.28,<3"]

[tool.uv]
default-groups = ["dev", "test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricehunter"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/pricehunter/localization/messages.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/pricehunter"]

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL database"]
addopts = "-ra"

[tool.coverage.run]
source = ["pricehunter"]
